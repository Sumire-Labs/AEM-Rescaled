// Publish the reobfuscated jar as the main Maven artifact in both Java variants.
def distributionJar = tasks.named('reobfJar').flatMap { it.output }
[configurations.apiElements, configurations.runtimeElements].each { variant ->
    variant.outgoing.artifacts.removeAll { it.type == 'jar' && !it.classifier }
    variant.outgoing.artifact(distributionJar) {
        type = 'jar'
        extension = 'jar'
    }
}

publishing {
    repositories {
        if (publish_to_maven.toBoolean() && !publish_to_local_maven.toBoolean()) {
            maven {
                name = maven_name.replaceAll('\\s', '')
                url = uri(maven_url)
                if (url.scheme != 'file') {
                    credentials {
                        username = providers.environmentVariable('MAVEN_USERNAME')
                            .orElse(providers.gradleProperty("${name}Username"))
                            .orElse(providers.gradleProperty('azureUserName'))
                            .orElse(providers.gradleProperty('mavenUser'))
                            .orElse(providers.environmentVariable('AZURE_USER_NAME'))
                            .orElse(providers.environmentVariable('MAVEN_USER')).orNull
                        password = providers.environmentVariable('MAVEN_PASSWORD')
                            .orElse(providers.gradleProperty("${name}Password"))
                            .orElse(providers.gradleProperty('azureToken'))
                            .orElse(providers.gradleProperty('mavenPassword'))
                            .orElse(providers.environmentVariable('AZURE_TOKEN'))
                            .orElse(providers.environmentVariable('MAVEN_PASS')).orNull
                    }
                    authentication { basic(org.gradle.authentication.http.BasicAuthentication) }
                }
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            from components.java
            setGroupId(root_package)
            setArtifactId(mod_id)
            version = project.version
            pom {
                name = mod_name
                description = mod_description
                url = mod_url
                licenses {
                    license {
                        name = 'GNU Lesser General Public License v3.0 or later'
                        url = 'https://www.gnu.org/licenses/lgpl-3.0.html'
                        distribution = 'repo'
                    }
                }
            }
        }
    }
}

if (publish_to_local_maven.toBoolean()) {
    tasks.named('build').configure {
        finalizedBy(tasks.named('publishToMavenLocal'))
    }
}
