name: Publish release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (for example 12.7.5)'
        required: true
        type: string
      curseforge:
        description: Publish to CurseForge
        type: boolean
        default: false
      modrinth:
        description: Publish to Modrinth
        type: boolean
        default: false
      maven:
        description: Publish to Sumire Labs Maven
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - name: Validate selected destinations
        working-directory: .
        env:
          PUBLISH_CURSEFORGE: ${{ inputs.curseforge }}
          PUBLISH_MODRINTH: ${{ inputs.modrinth }}
          PUBLISH_MAVEN: ${{ inputs.maven }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASS: ${{ secrets.MAVEN_PASS }}
        run: |
          if [[ "$PUBLISH_CURSEFORGE" != true && "$PUBLISH_MODRINTH" != true && "$PUBLISH_MAVEN" != true ]]; then
            echo 'Select at least one destination.' >&2
            exit 1
          fi
          if [[ "$PUBLISH_CURSEFORGE" == true && -z "$CURSEFORGE_TOKEN" ]]; then
            echo 'Set the CURSEFORGE_TOKEN secret.' >&2
            exit 1
          fi
          if [[ "$PUBLISH_MODRINTH" == true && -z "$MODRINTH_TOKEN" ]]; then
            echo 'Set the MODRINTH_TOKEN secret.' >&2
            exit 1
          fi
          if [[ "$PUBLISH_MAVEN" == true && ( -z "$MAVEN_USER" || -z "$MAVEN_PASS" ) ]]; then
            echo 'Set the MAVEN_USER and MAVEN_PASS secrets.' >&2
            exit 1
          fi
      - name: Resolve Modrinth project ID
        working-directory: .
        if: inputs.modrinth
        id: modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID || 'jgRO15f7' }}
        run: |
          project_id="$MODRINTH_PROJECT_ID"
          if [[ ! "$project_id" =~ ^[A-Za-z0-9]+$ ]]; then
            echo 'Invalid Modrinth project ID.' >&2
            exit 1
          fi
          if project=$(curl --fail --silent --show-error \
            --header "Authorization: $MODRINTH_TOKEN" \
            --user-agent "$GITHUB_REPOSITORY (GitHub Actions)" \
            "https://api.modrinth.com/v2/project/$project_id"); then
            jq '{id, slug, title, status}' <<< "$project"
          else
            echo '::warning::Modrinth project metadata is not accessible. Upload permission will be checked by publishMods; public visibility must be checked separately.'
          fi
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
      - name: Checkout release tooling
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - name: Checkout tagged sources
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6.4.1
        name: Set up Gradle

      - name: Add permission
        run: chmod +x ./gradlew

      - name: Execute Gradle build
        run: |
          GITHUB_REF="refs/tags/$RELEASE_TAG" GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" \
            ./gradlew clean build verifyReleaseJar writeReleaseMetadata \
              --init-script "$GITHUB_WORKSPACE/release-tools/gradle/release-verification.init.gradle" \
              -Prelease_verification_script="$GITHUB_WORKSPACE/release-tools/gradle/scripts/verify-release.gradle"

      - name: Publish to Maven
        if: inputs.maven
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASS: ${{ secrets.MAVEN_PASS }}
        run: |
          cat > "$RUNNER_TEMP/maven-auth.init.gradle" <<'EOF'
          gradle.projectsEvaluated {
              gradle.rootProject.publishing.repositories.named('SumireLabs').configure {
                  if (authentication.findByName('basic') == null) {
                      authentication { basic(org.gradle.authentication.http.BasicAuthentication) }
                  }
              }
          }
          EOF
          GITHUB_REF="refs/tags/$RELEASE_TAG" GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" \
            ./gradlew publishMavenJavaPublicationToSumireLabsRepository -Ppublish_to_maven=true \
              --init-script "$RUNNER_TEMP/maven-auth.init.gradle"

      - name: Get Changes between Tags
        run: |
          awk -v tag="$RELEASE_TAG" '
            BEGIN { sub(/^v/, "", tag) }
            { sub(/\r$/, "") }
            /^#{1,2}[ \t]+/ {
              match($0, /^#+/)
              depth = RLENGTH
              label = $0
              sub(/^#+[ \t]+/, "", label)
              split(label, words, /[ \t]+/)
              if (found && depth <= sectionDepth) exit
              if (words[1] == "[" tag "]") { found = 1; sectionDepth = depth; next }
            }
            found { print }
          ' CHANGELOG.md > build/release-changelog.md
          if [ ! -s build/release-changelog.md ]; then
            previous=$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)
            git log --format='- %s (%h)' "${previous:+$previous..}HEAD" > build/release-changelog.md
          fi

      - name: Publish Mods
        if: inputs.curseforge || inputs.modrinth
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ inputs.curseforge && '1736004' || '' }}
          MODRINTH_PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
          CHANGELOG_FILE: build/release-changelog.md
        run: |
          GITHUB_REF="refs/tags/$RELEASE_TAG" GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" \
            ./gradlew publishMods --console=plain \
              "-Pcurseforge_project_id=$CURSEFORGE_PROJECT_ID" \
              "-Pmodrinth_project_id=$MODRINTH_PROJECT_ID"

      - name: Save publication receipts
        if: always() && (inputs.curseforge || inputs.modrinth)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: publication-receipts
          path: source/build/publishMods/*.json
