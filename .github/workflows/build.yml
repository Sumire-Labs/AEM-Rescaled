name: Build mod jar

on: [workflow_dispatch, push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v6.1.0
        name: Set up Gradle
      - name: Execute Gradle build
        run: ./gradlew clean build verifyReleaseJar

      - name: Verify Maven publication
        run: >-
          ./gradlew publish -Ppublish_to_maven=true -Ppublish_to_local_maven=false
          -Pmaven_url=build/maven-verification

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: build/libs
