name: Releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (for example 13.0.0 or 13.0.1)'
        required: true
        type: string
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release-tools
      - name: Checkout tagged sources
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: source
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v6.1.0
        name: Set up Gradle
      - name: Execute Gradle build
        run: |
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" ./gradlew clean build verifyReleaseJar writeReleaseMetadata \
            --init-script "$GITHUB_WORKSPACE/release-tools/gradle/release-verification.init.gradle" \
            -Prelease_verification_script="$GITHUB_WORKSPACE/release-tools/gradle/scripts/verify-release.gradle"

      - name: Read release metadata
        id: metadata
        run: cat build/release-metadata.properties >> "$GITHUB_OUTPUT"

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          : > build/release-notes.md
          if [[ -f CHANGELOG.md ]]; then
            awk -v tag="$RELEASE_TAG" '
              { sub(/\r$/, "") }
              /^#{1,2}[ \t]+/ {
                match($0, /^#+/)
                depth = RLENGTH
                label = $0
                sub(/^#+[ \t]+/, "", label)
                split(label, words, /[ \t]+/)
                if (found && depth <= sectionDepth) exit
                if (words[1] == "[" tag "]") { found = 1; sectionDepth = depth; next }
              }
              found { notes = notes $0 ORS }
              END { if (notes ~ /[^[:space:]]/) printf "%s", notes }
            ' CHANGELOG.md > build/release-notes.md
          fi
          if [[ -s build/release-notes.md ]]; then
            echo 'body_file=source/build/release-notes.md' >> "$GITHUB_OUTPUT"
            echo 'generate=false' >> "$GITHUB_OUTPUT"
          else
            echo 'generate=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Select release artifacts
        shell: bash
        run: |
          mkdir -p build/release
          for artifact in build/libs/*.jar; do
            case "$artifact" in
              *-dev.jar|*-mcp.jar|*-shadow.jar) continue ;;
            esac
            cp "$artifact" build/release/
          done

      - uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ env.RELEASE_TAG }}
          artifacts: "source/build/release/*.jar"
          artifactErrorsFailBuild: true
          bodyFile: ${{ steps.notes.outputs.body_file }}
          generateReleaseNotes: ${{ steps.notes.outputs.generate == 'true' }}
          prerelease: ${{ steps.metadata.outputs.stage != 'release' }}
