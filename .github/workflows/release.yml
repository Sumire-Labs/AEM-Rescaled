name: Releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (for example 12.7.5)'
        required: true
        type: string
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - name: Checkout tagged sources
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v6.2.0
        with:
          java-version: "25"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v6.4.1
        name: Set up Gradle
      - name: Read release configuration
        id: release
        run: |
          info=$(GITHUB_REF="refs/tags/$RELEASE_TAG" GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" \
            ./gradlew -q --console=plain printReleaseInfo)
          echo "maven=$(jq -r .maven <<< "$info")" >> "$GITHUB_OUTPUT"
          echo "curseforge=$(jq -r .curseforge <<< "$info")" >> "$GITHUB_OUTPUT"
          echo "modrinth=$(jq -r .modrinth <<< "$info")" >> "$GITHUB_OUTPUT"
      - name: Check publication credentials
        env:
          PUBLISH_MAVEN: ${{ steps.release.outputs.maven }}
          PUBLISH_CURSEFORGE: ${{ steps.release.outputs.curseforge }}
          PUBLISH_MODRINTH: ${{ steps.release.outputs.modrinth }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME || secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD || secrets.MAVEN_PASS }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [[ "$PUBLISH_MAVEN" == true && ( -z "$MAVEN_USERNAME" || -z "$MAVEN_PASSWORD" ) ]]; then
            echo 'Maven enabled: set MAVEN_USERNAME/MAVEN_PASSWORD or MAVEN_USER/MAVEN_PASS.' >&2
            exit 1
          fi
          if [[ "$PUBLISH_CURSEFORGE" == true && -z "$CURSEFORGE_TOKEN" ]]; then
            echo 'CurseForge ID configured: set CURSEFORGE_TOKEN.' >&2
            exit 1
          fi
          if [[ "$PUBLISH_MODRINTH" == true && -z "$MODRINTH_TOKEN" ]]; then
            echo 'Modrinth ID configured: set MODRINTH_TOKEN.' >&2
            exit 1
          fi
      - name: Execute Gradle build
        run: |
          GITHUB_REF="refs/tags/$RELEASE_TAG" GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" \
            ./gradlew clean build verifyReleaseJar writeReleaseMetadata \
            --init-script "$GITHUB_WORKSPACE/release-tools/gradle/release-verification.init.gradle" \
            -Prelease_verification_script="$GITHUB_WORKSPACE/release-tools/gradle/scripts/verify-release.gradle"

      - name: Read release metadata
        id: metadata
        run: cat build/release-metadata.properties >> "$GITHUB_OUTPUT"

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          : > build/release-notes.md
          if [[ -f CHANGELOG.md ]]; then
            awk -v tag="$RELEASE_TAG" '
              BEGIN { sub(/^v/, "", tag) }
              { sub(/\r$/, "") }
              /^#{1,2}[ \t]+/ {
                match($0, /^#+/)
                depth = RLENGTH
                label = $0
                sub(/^#+[ \t]+/, "", label)
                split(label, words, /[ \t]+/)
                if (found && depth <= sectionDepth) exit
                if (words[1] == "[" tag "]") { found = 1; sectionDepth = depth; next }
              }
              found { notes = notes $0 ORS }
              END { if (notes ~ /[^[:space:]]/) printf "%s", notes }
            ' CHANGELOG.md > build/release-notes.md
          fi
          if [[ -s build/release-notes.md ]]; then
            echo 'body_file=source/build/release-notes.md' >> "$GITHUB_OUTPUT"
            echo 'generate=false' >> "$GITHUB_OUTPUT"
          else
            echo "CHANGELOG.md must have a nonempty section for tag $RELEASE_TAG." >&2
            exit 1
          fi

      - name: Publish Maven artifacts
        if: steps.release.outputs.maven == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME || secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD || secrets.MAVEN_PASS }}
        run: |
          GITHUB_REF="refs/tags/$RELEASE_TAG" GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" \
            ./gradlew publish --console=plain

      - name: Publish Mods
        if: steps.release.outputs.curseforge == 'true' || steps.release.outputs.modrinth == 'true'
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CHANGELOG_FILE: build/release-notes.md
        run: |
          GITHUB_REF="refs/tags/$RELEASE_TAG" GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" \
            ./gradlew publishMods --console=plain

      - name: Select release artifacts
        shell: bash
        run: |
          mkdir -p build/release
          for artifact in build/libs/*.jar; do
            case "$artifact" in
              *-dev.jar|*-mcp.jar|*-shadow.jar) continue ;;
            esac
            cp "$artifact" build/release/
          done

      - uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ env.RELEASE_TAG }}
          artifacts: "source/build/release/*.jar"
          artifactErrorsFailBuild: true
          bodyFile: ${{ steps.notes.outputs.body_file }}
          generateReleaseNotes: ${{ steps.notes.outputs.generate == 'true' }}
          prerelease: ${{ steps.metadata.outputs.stage != 'release' }}
